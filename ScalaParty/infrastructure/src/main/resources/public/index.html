<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScalaParty</title>
  <style>
    body {
      margin: 0;
      background: #0d0d11;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #edf6ff;
      font-family: monospace;
    }

    .panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    canvas {
      border: 2px solid #2a2a3a;
      background-color: #121218;
      box-shadow: 0 0 20px rgba(0, 255, 204, 0.15);
    }

    .status {
      min-height: 1.5em;
      color: #9ee7ff;
      letter-spacing: 0.04em;
    }

    .debug-log {
      width: 800px;
      max-height: 180px;
      overflow-y: auto;
      border: 1px solid #2a2a3a;
      background: #0b0b10;
      color: #b8f7cc;
      padding: 8px;
      box-sizing: border-box;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 12px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="panel">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div id="status" class="status">Connecting to server...</div>
    <div id="debugLog" class="debug-log"></div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');
    const debugLogEl = document.getElementById('debugLog');

    const SHIP_HEIGHT = 24;
    const SHIP_BASE = 14;
    const BULLET_RADIUS = 3;
    const MAX_LOG_LINES = 50;

    const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
    const host = window.location.hostname || 'localhost';
    const port = window.location.port || '8081';
    const socket = new WebSocket(`${protocol}://${host}:${port}/scalaparty/ws`);

    const logLines = [];

    function appendLog(message) {
      const now = new Date().toISOString().slice(11, 19);
      logLines.push(`[${now}] ${message}`);
      if (logLines.length > MAX_LOG_LINES) {
        logLines.shift();
      }
      debugLogEl.textContent = `${logLines.join('\n')}\n`;
      debugLogEl.scrollTop = debugLogEl.scrollHeight;
    }

    let currentShip = {
      position: { x: canvas.width / 2, y: canvas.height / 2 },
      velocity: { x: 0, y: 0 },
      angle: 0
    };
    let currentBullets = [];

    // The server tags every entity DTO with its case name (e.g. { Spaceship: {...} }, { Bullet: {...} }).
    function extractEntities(payload) {
      return Array.isArray(payload)
        ? payload
        : Array.isArray(payload?.entities)
          ? payload.entities
          : [];
    }

    function toShipState(ship, previous) {
      const pos = ship.position ?? previous.position;
      const vel = ship.velocity ?? { x: 0, y: 0 };
      return {
        position: {
          x: Number(pos.x ?? previous.position.x),
          y: Number(pos.y ?? previous.position.y)
        },
        velocity: {
          x: Number(vel.x ?? previous.velocity.x),
          y: Number(vel.y ?? previous.velocity.y)
        },
        angle: Math.atan2(Number(vel.y ?? 0), Number(vel.x ?? 1))
      };
    }

    function toPosition(entity) {
      return {
        x: Number(entity.position?.x ?? 0),
        y: Number(entity.position?.y ?? 0)
      };
    }

    function updateFromServer(rawMessage) {
      try {
        const payload = JSON.parse(rawMessage);
        const entities = extractEntities(payload);

        const shipEntry = entities.find(entry => entry && 'Spaceship' in entry);
        if (shipEntry) {
          currentShip = toShipState(shipEntry.Spaceship, currentShip);
        }

        currentBullets = entities
          .filter(entry => entry && 'Bullet' in entry)
          .map(entry => toPosition(entry.Bullet));
      } catch (error) {
        console.error('Invalid server payload', error);
      }
    }

    function drawSpaceship(x, y, angle) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);

      ctx.beginPath();
      ctx.moveTo(SHIP_HEIGHT / 2, 0);
      ctx.lineTo(-SHIP_HEIGHT / 2, -SHIP_BASE / 2);
      ctx.lineTo(-SHIP_HEIGHT / 2, SHIP_BASE / 2);
      ctx.closePath();

      ctx.fillStyle = '#00ffcc';
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.restore();
    }

    function drawBullet(x, y) {
      ctx.beginPath();
      ctx.arc(x, y, BULLET_RADIUS, 0, Math.PI * 2);
      ctx.fillStyle = '#ffcc00';
      ctx.fill();
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawSpaceship(currentShip.position.x, currentShip.position.y, currentShip.angle);
      currentBullets.forEach(bullet => drawBullet(bullet.x, bullet.y));
    }

    function gameLoop() {
      render();
      requestAnimationFrame(gameLoop);
    }

    socket.addEventListener('open', () => {
      statusEl.textContent = 'Connected to ScalaParty server';
      appendLog('WebSocket connected');
    });

    socket.addEventListener('close', () => {
      statusEl.textContent = 'Disconnected from server';
      appendLog('WebSocket disconnected');
    });

    socket.addEventListener('error', () => {
      appendLog('WebSocket error');
    });

    socket.addEventListener('message', (event) => {
      appendLog(`Received: ${event.data}`);
      updateFromServer(event.data);
    });

    // Sends a PlayerInput command to the server, doing nothing if the socket is not ready yet.
    function sendCommand(command, label) {
      if (socket.readyState !== WebSocket.OPEN) {
        statusEl.textContent = 'Socket not ready yet';
        appendLog(`${label} skipped: socket not open`);
        return false;
      }
      const json = JSON.stringify(command);
      socket.send(json);
      appendLog(`Sent: ${json}`);
      return true;
    }

    document.addEventListener('keydown', (event) => {
      switch (event.key.toLowerCase()) {
        case 'r': {
          event.preventDefault();
          const angle = 2.0;
          if (sendCommand({ Rotate: { angle } }, 'Rotate')) {
            statusEl.textContent = `Rotated by ${angle}°`;
          }
          break;
        }
        case ' ': {
          event.preventDefault();
          if (sendCommand({ Shoot: {} }, 'Shoot')) {
            statusEl.textContent = 'Fired!';
          }
          break;
        }
      }
    });

    appendLog(`Connecting to WebSocket at ${protocol}://${host}:${port}/scalaparty/ws`);
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
