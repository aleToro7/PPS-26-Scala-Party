<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScalaParty</title>
    <style>
        body {
            margin: 0;
            background: #0d0d11;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #edf6ff;
            font-family: monospace;
        }

        .panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        /* --- UI Overlay Styles --- */
        .hud-container {
            width: 800px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            padding: 0 4px;
        }

        .health-bar-bg {
            flex-grow: 1;
            height: 14px;
            background: #2a2a3a;
            border-radius: 7px;
            overflow: hidden;
            margin-right: 16px;
            box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.5);
        }

        .health-bar-fill {
            height: 100%;
            width: 100%;
            background-color: #00ffcc;
            transition: width 0.2s ease-out, background-color 0.3s ease;
        }

        .health-text {
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            min-width: 80px;
            text-align: right;
        }

        /* ------------------------- */

        canvas {
            border: 2px solid #2a2a3a;
            background-color: #121218;
            box-shadow: 0 0 20px rgba(212, 0, 255, 0.15);
        }

        .status {
            min-height: 1.5em;
            color: #9ee7ff;
            letter-spacing: 0.04em;
        }
    </style>
</head>
<body>
<div class="panel">
    <!-- HUD Layer -->
    <div class="hud-container">
        <div class="health-bar-bg">
            <div id="healthBarFill" class="health-bar-fill"></div>
        </div>
        <div id="healthText" class="health-text">HP: 100/100</div>
    </div>

    <!-- Game Layer -->
    <canvas id="gameCanvas" width="800" height="800"></canvas>

    <!-- Status Layer -->
    <div id="identity" class="status"></div>
    <div id="status" class="status">Connecting to server...</div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');
    const identityEl = document.getElementById('identity');
    const healthBarFill = document.getElementById('healthBarFill');
    const healthText = document.getElementById('healthText');

    const SHIP_HEIGHT = 24;
    const SHIP_BASE = 14;
    const BULLET_FALLBACK_RADIUS = 3;

    const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
    const host = window.location.hostname || 'localhost';
    const port = window.location.port || '8081';
    const socket = new WebSocket(`${protocol}://${host}:${port}/scalaparty/ws`);

    // One color for each of the (up to four) players of a match.
    const PLAYER_COLORS = [
        {name: 'cyan', hex: '#00ffcc'},
        {name: 'blue', hex: '#3d8bff'},
        {name: 'green', hex: '#3ddc84'},
        {name: 'violet', hex: '#b36bff'}
    ];

    let currentShips = [];
    // The entity this player controls in the current match, as told by the server when the match starts.
    let myShipId = null;
    // The color of every spaceship in the current match, chosen when its first state arrives.
    let shipColors = new Map();
    // Whether the server turned this player away, so that the closing connection is not reported as a failure.
    let turnedAway = false;

    let currentBullets = [];
    let knownBulletIds = new Set();
    let particles = [];
    let currentWalls = [];

    // --- Arena State (dynamically updated from server) ---
    let currentArena = {
        width: 800,
        height: 800,
        center: {x: 0, y: 0}
    };

    // Flag to ensure arena is initialized only once from the JSON payload
    let arenaInitialized = false;

    // --- Input Management System ---
    const activeKeys = new Set();
    let lastShootTime = 0;
    const SHOOT_COOLDOWN_MS = 250;

    document.addEventListener('keydown', (event) => {
        activeKeys.add(event.key.toLowerCase());
        if (event.key === ' ') event.preventDefault();
    });

    document.addEventListener('keyup', (event) => {
        activeKeys.delete(event.key.toLowerCase());
    });

    function processInput() {
        // A dead spaceship can no longer be controlled
        if (socket.readyState !== WebSocket.OPEN || !findMyShip()) return;

        if (activeKeys.has('r')) {
            sendCommand({Rotate: {angle: 2.0}});
        }

        if (activeKeys.has(' ')) {
            const now = Date.now();
            if (now - lastShootTime >= SHOOT_COOLDOWN_MS) {
                sendCommand({Shoot: {}});
                lastShootTime = now;
            }
        }
    }

    // -------------------------------

    // Lobby notifications share the socket with the match states: only the latter carry the entities
    function extractEntities(payload) {
        return Array.isArray(payload)
            ? payload
            : Array.isArray(payload?.entities)
                ? payload.entities
                : null;
    }

    function toShipState(ship, previous) {
        const pos = ship.position ?? previous.position;
        const vel = ship.velocity ?? {x: 0, y: 0};

        // Convert server rotation (degrees) to radians, fallback to velocity calculation if not present
        const angle = ship.rotation !== undefined
            ? ship.rotation * (Math.PI / 180)
            : Math.atan2(Number(vel.y ?? 0), Number(vel.x ?? 1));

        return {
            position: {
                x: Number(pos.x ?? previous.position.x),
                y: Number(pos.y ?? previous.position.y)
            },
            velocity: {
                x: Number(vel.x ?? previous.velocity.x),
                y: Number(vel.y ?? previous.velocity.y)
            },
            angle: angle,
            health: Number(ship.health ?? previous.health),
            maxHealth: Number(ship.maxHealth ?? previous.maxHealth)
        };
    }

    function toPosition(entity) {
        return {
            x: Number(entity.position?.x ?? 0),
            y: Number(entity.position?.y ?? 0)
        };
    }

    function spawnParticles(x, y) {
        for (let i = 0; i < 20; i++) {
            particles.push({
                x: x,
                y: y,
                vx: (Math.random() - 0.5) * 12,
                vy: (Math.random() - 0.5) * 12,
                life: 1.0,
                decay: Math.random() * 0.05 + 0.03,
                color: Math.random() > 0.5 ? '#00ffcc' : '#ffcc00'
            });
        }
    }

    // Lobby notifications are tagged with their case name (e.g. { Queued: { playersAhead: 0 } }),
    // unlike the match state, which is a plain { tick, entities } object.
    // Returns whether the payload was one of them.
    function handleServerMessage(message) {
        if (message.Queued) {
            const ahead = message.Queued.playersAhead;
            statusEl.textContent = ahead === 0 ? 'Waiting: you are next' : `Waiting: ${ahead} player(s) ahead of you`;
        } else if (message.QueueFull) {
            turnedAway = true;
            statusEl.textContent = 'The queue is full: try again later';
        } else if (message.MatchStarted) {
            myShipId = message.MatchStarted.you;
            shipColors = new Map();
            statusEl.textContent = `Match started with ${message.MatchStarted.players} player(s)`;
        } else if (message.MatchEnded) {
            myShipId = null;
            shipColors = new Map();
            showIdentity(null);
            currentShips = [];
            currentBullets.length = 0;
            statusEl.textContent = 'Match over';
        } else {
            return false;
        }
        return true;
    }

    // Every client of a match receives the same first state, holding the spaceships of all its players:
    // coloring them in the order of their ids gives each player the same color in every client, which
    // it keeps even when other players leave.
    function assignShipColors(ships) {
        if (shipColors.size > 0 || ships.length === 0) {
            return;
        }
        [...ships]
            .sort((a, b) => a.id - b.id)
            .forEach((ship, index) => shipColors.set(ship.id, PLAYER_COLORS[index % PLAYER_COLORS.length]));
        showIdentity(shipColors.get(myShipId) ?? null);
    }

    function colorOf(shipId) {
        return shipColors.get(shipId) ?? PLAYER_COLORS[Math.abs(shipId) % PLAYER_COLORS.length];
    }

    // Tells the player which spaceship is its own, also in the tab title to tell the tabs apart.
    function showIdentity(color) {
        if (color) {
            identityEl.textContent = `You are the ${color.name} spaceship`;
            identityEl.style.color = color.hex;
            document.title = `ScalaParty - ${color.name}`;
        } else {
            identityEl.textContent = '';
            document.title = 'ScalaParty';
        }
    }

    // The server removes a spaceship in the same update that depletes its health,
    // so the spaceship of this player missing from the match state is a dead one
    function findMyShip() {
        return currentShips.find(ship => ship.id === myShipId);
    }

    // Track the last known health to prevent unnecessary DOM updates
    let lastRenderedHealth = -1;
    // Kept to still show the maximum health once the spaceship of this player is dead
    let lastMaxHealth = 100;

    // The health bar shows the spaceship of this player only, emptied once it dies.
    function updateUI() {
        if (myShipId === null) return;
        const myShip = findMyShip();
        const hp = myShip ? myShip.health : 0;

        // Skip DOM manipulation if health hasn't changed
        if (hp === lastRenderedHealth) return;
        lastRenderedHealth = hp;

        if (!myShip) {
            statusEl.textContent = "You're dead";
        }

        const maxHp = myShip ? myShip.maxHealth : lastMaxHealth;
        lastMaxHealth = maxHp;
        const safeMax = maxHp > 0 ? maxHp : 1;
        const percentage = Math.max(0, Math.min(100, (hp / safeMax) * 100));

        healthBarFill.style.width = `${percentage}%`;
        healthText.textContent = `HP: ${hp}/${maxHp}`;

        if (percentage > 50) {
            healthBarFill.style.backgroundColor = '#00ffcc';
        } else if (percentage > 25) {
            healthBarFill.style.backgroundColor = '#ffcc00';
        } else {
            healthBarFill.style.backgroundColor = '#ff3366';
        }
    }

    function updateArenaDimensions(arena) {
        // Discard subsequent updates once initialized
        if (arenaInitialized) return;

        const w = Number(arena.width ?? currentArena.width);
        const h = Number(arena.height ?? currentArena.height);
        const cx = Number(arena.center?.x ?? currentArena.center.x);
        const cy = Number(arena.center?.y ?? currentArena.center.y);

        currentArena = {width: w, height: h, center: {x: cx, y: cy}};
        canvas.width = w;
        canvas.height = h;
        const hud = document.querySelector('.hud-container');
        if (hud) hud.style.width = `${w}px`;

        arenaInitialized = true;
    }

    function updateFromServer(rawMessage) {
        try {
            const payload = JSON.parse(rawMessage);
            if (handleServerMessage(payload)) {
                return;
            }

            if (payload.arena) {
                updateArenaDimensions(payload.arena);
            }

            const entities = extractEntities(payload);
            if (entities === null) return;

            // Clear the arrays without reallocating memory
            currentShips.length = 0;
            // Clear arrays without reallocating memory
            currentBullets.length = 0;
            currentWalls.length = 0;
            const currentBulletIds = new Set();

            for (let i = 0; i < entities.length; i++) {
                const entry = entities[i];
                if (!entry) continue;

                if ('Spaceship' in entry) {
                    currentShips.push(toShipState(entry.Spaceship));
                } else if ('Bullet' in entry) {
                    const bulletData = entry.Bullet;
                    const pos = toPosition(bulletData);

                    // Extract radius from the nested shape object
                    const radius = Number(bulletData.shape?.radius ?? BULLET_FALLBACK_RADIUS);

                    // Push an object holding position and radius
                    currentBullets.push({x: pos.x, y: pos.y, radius: radius});

                    if (bulletData.id !== undefined) {
                        currentBulletIds.add(bulletData.id);
                        if (!knownBulletIds.has(bulletData.id)) {
                            spawnParticles(pos.x, pos.y);
                        }
                    }
                } else if ('Wall' in entry) {
                    const wallData = entry.Wall;
                    const pos = toPosition(wallData);
                    const shape = wallData.shape || {};
                    const w = Number(shape.width ?? 80);
                    const h = Number(shape.height ?? 80);
                    currentWalls.push({
                        id: wallData.id,
                        x: pos.x - w / 2,
                        y: pos.y - h / 2,
                        width: w,
                        height: h
                    });
                }
            }

            knownBulletIds = currentBulletIds;
            assignShipColors(currentShips);
            updateUI();
        } catch (error) {
            console.error('Invalid server payload', error);
        }
    }

    // Each spaceship has the color of its player, the same in every client.
    function drawSpaceship(x, y, angle, color) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);

        ctx.beginPath();
        ctx.moveTo(SHIP_HEIGHT / 2, 0);
        ctx.lineTo(-SHIP_HEIGHT / 2, -SHIP_BASE / 2);
        ctx.lineTo(-SHIP_HEIGHT / 2, SHIP_BASE / 2);
        ctx.closePath();

        ctx.fillStyle = color.hex;
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.restore();
    }

    function drawBullet(bullet) {
        const timeOffset = Date.now() / 80;

        // Base the pulse visual on the actual radius provided by the server payload
        // We use a minimum multiplier just in case radius = 1 is too hard to see on screen
        const visualRadius = Math.max(bullet.radius, 2);
        const pulseRadius = visualRadius + Math.sin(timeOffset) * (visualRadius * 0.5);

        ctx.save();

        // Replaced expensive shadowBlur with a high-performance radial gradient
        // The gradient glow is slightly larger than the core
        const gradientRadius = pulseRadius * 2.5;
        const gradient = ctx.createRadialGradient(bullet.x, bullet.y, 0, bullet.x, bullet.y, gradientRadius);
        gradient.addColorStop(0, '#ffffff');
        gradient.addColorStop(0.3, '#ff3366');
        gradient.addColorStop(1, 'rgba(255, 0, 85, 0)');

        ctx.beginPath();
        ctx.arc(bullet.x, bullet.y, gradientRadius, 0, Math.PI * 2);
        ctx.fillStyle = gradient;
        ctx.fill();

        ctx.restore();
    }

    function updateAndDrawParticles() {
        ctx.globalCompositeOperation = 'lighter';
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life -= p.decay;

            if (p.life <= 0) {
                particles.splice(i, 1);
                continue;
            }

            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.life * 3, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.globalAlpha = 1.0;
        ctx.globalCompositeOperation = 'source-over';
    }

    function drawArenaBounds() {
        ctx.save();
        const halfW = currentArena.width / 2;
        const halfH = currentArena.height / 2;
        const left = currentArena.center.x - halfW;
        const top = currentArena.center.y - halfH;

        ctx.strokeStyle = 'rgba(212, 0, 255, 0.3)';
        ctx.lineWidth = 2;
        ctx.strokeRect(left, top, currentArena.width, currentArena.height);
        ctx.restore();
    }

    function drawWall(wall) {
        ctx.save();

        // 1. Outer purple/fuchsia glow effect
        ctx.shadowColor = '#d400ff';
        ctx.shadowBlur = 12;

        // 2. Translucent forcefield background (dark purplish tint)
        ctx.fillStyle = 'rgba(30, 10, 45, 0.7)';
        ctx.fillRect(wall.x, wall.y, wall.width, wall.height);

        // Reduce shadow blur for the crisp inner elements to improve performance
        ctx.shadowBlur = 4;

        // 3. Bright fuchsia border
        ctx.strokeStyle = '#ff00ff';
        ctx.lineWidth = 2;
        ctx.strokeRect(wall.x, wall.y, wall.width, wall.height);

        // 4. Light pink inner core outline
        ctx.strokeStyle = 'rgba(255, 150, 255, 0.6)';
        ctx.lineWidth = 1;
        ctx.strokeRect(wall.x + 4, wall.y + 4, wall.width - 8, wall.height - 8);

        // 5. Diagonal scanlines / sci-fi grid overlay in purple/fuchsia
        ctx.strokeStyle = 'rgba(212, 0, 255, 0.25)';
        ctx.beginPath();
        // Draw diagonal lines across the wall block
        for (let i = 8; i < wall.width + wall.height; i += 12) {
            let startX = Math.min(wall.x + i, wall.x + wall.width);
            let startY = Math.max(wall.y, wall.y + i - wall.width);
            let endX = Math.max(wall.x, wall.x + i - wall.height);
            let endY = Math.min(wall.y + i, wall.y + wall.height);
            ctx.moveTo(startX, startY);
            ctx.lineTo(endX, endY);
        }
        ctx.stroke();

        ctx.restore();
    }

    function drawWalls() {
        for (let i = 0; i < currentWalls.length; i++) {
            drawWall(currentWalls[i]);
        }
    }

    function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.save();
        // Universal coordinate translation based on arena center
        const offsetX = canvas.width / 2 - currentArena.center.x;
        const offsetY = canvas.height / 2 - currentArena.center.y;
        ctx.translate(offsetX, offsetY);

        drawArenaBounds();
        drawWalls();
        // Pass the entire bullet object to drawBullet
        currentBullets.forEach(bullet => drawBullet(bullet));
        currentShips.forEach(ship => drawSpaceship(ship.position.x, ship.position.y, ship.angle, colorOf(ship.id)));
        currentBullets.forEach(bullet => drawBullet(bullet.x, bullet.y));
        updateAndDrawParticles();

        ctx.restore();
    }

    function gameLoop() {
        processInput();
        render();
        requestAnimationFrame(gameLoop);
    }

    socket.addEventListener('open', () => {
        statusEl.textContent = 'Connected to ScalaParty server';
    });

    socket.addEventListener('close', () => {
        if (!turnedAway) {
            statusEl.textContent = 'Disconnected from server';
        }
    });

    socket.addEventListener('message', (event) => {
        updateFromServer(event.data);
    });

    function sendCommand(command) {
        socket.send(JSON.stringify(command));
    }

    requestAnimationFrame(gameLoop);
</script>
</body>
</html>
