<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScalaParty</title>
  <style>
    body {
      margin: 0;
      background: #0d0d11;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #edf6ff;
      font-family: monospace;
    }

    .panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    canvas {
      border: 2px solid #2a2a3a;
      background-color: #121218;
      box-shadow: 0 0 20px rgba(0, 255, 204, 0.15);
    }

    .status {
      min-height: 1.5em;
      color: #9ee7ff;
      letter-spacing: 0.04em;
    }

    .debug-log {
      width: 800px;
      max-height: 180px;
      overflow-y: auto;
      border: 1px solid #2a2a3a;
      background: #0b0b10;
      color: #b8f7cc;
      padding: 8px;
      box-sizing: border-box;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 12px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="panel">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div id="identity" class="status"></div>
    <div id="status" class="status">Connecting to server...</div>
    <div id="debugLog" class="debug-log"></div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');
    const identityEl = document.getElementById('identity');
    const debugLogEl = document.getElementById('debugLog');

    const SHIP_HEIGHT = 24;
    const SHIP_BASE = 14;
    const BULLET_RADIUS = 3;
    const MAX_LOG_LINES = 50;

    const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
    const host = window.location.hostname || 'localhost';
    const port = window.location.port || '8081';
    const socket = new WebSocket(`${protocol}://${host}:${port}/scalaparty/ws`);

    const logLines = [];

    function appendLog(message) {
      const now = new Date().toISOString().slice(11, 19);
      logLines.push(`[${now}] ${message}`);
      if (logLines.length > MAX_LOG_LINES) {
        logLines.shift();
      }
      debugLogEl.textContent = `${logLines.join('\n')}\n`;
      debugLogEl.scrollTop = debugLogEl.scrollHeight;
    }

    // One color for each of the (up to four) players of a match, never the yellow of the bullets.
    const PLAYER_COLORS = [
      { name: 'red', hex: '#ff4f5e' },
      { name: 'blue', hex: '#3d8bff' },
      { name: 'green', hex: '#3ddc84' },
      { name: 'violet', hex: '#b36bff' }
    ];

    let currentShips = [];
    let currentBullets = [];
    // The entity this player controls in the current match, as told by the server when the match starts.
    let myShipId = null;
    // The color of every spaceship in the current match, chosen when its first state arrives.
    let shipColors = new Map();
    // Whether the server turned this player away, so that the closing connection is not reported as a failure.
    let turnedAway = false;

    // The server tags every entity DTO with its case name (e.g. { Spaceship: {...} }, { Bullet: {...} }).
    function extractEntities(payload) {
      return Array.isArray(payload)
        ? payload
        : Array.isArray(payload?.entities)
          ? payload.entities
          : [];
    }

    function toShipState(ship) {
      const vel = ship.velocity ?? { x: 1, y: 0 };
      return {
        id: ship.id,
        position: toPosition(ship),
        angle: Math.atan2(Number(vel.y ?? 0), Number(vel.x ?? 1))
      };
    }

    function toPosition(entity) {
      return {
        x: Number(entity.position?.x ?? 0),
        y: Number(entity.position?.y ?? 0)
      };
    }

    // Lobby notifications are tagged with their case name (e.g. { Queued: { playersAhead: 0 } }),
    // unlike the match state, which is a plain { tick, entities } object.
    // Returns whether the payload was one of them.
    function handleServerMessage(message) {
      if (message.Queued) {
        const ahead = message.Queued.playersAhead;
        statusEl.textContent = ahead === 0 ? 'Waiting: you are next' : `Waiting: ${ahead} player(s) ahead of you`;
      } else if (message.QueueFull) {
        turnedAway = true;
        statusEl.textContent = 'The queue is full: try again later';
      } else if (message.MatchStarted) {
        myShipId = message.MatchStarted.you;
        shipColors = new Map();
        statusEl.textContent = `Match started with ${message.MatchStarted.players} player(s)`;
      } else if (message.MatchEnded) {
        myShipId = null;
        shipColors = new Map();
        showIdentity(null);
        currentShips = [];
        currentBullets = [];
        statusEl.textContent = 'Match over';
      } else {
        return false;
      }
      return true;
    }

    // Every client of a match receives the same first state, holding the spaceships of all its players:
    // coloring them in the order of their ids gives each player the same color in every client, which
    // it keeps even when other players leave.
    function assignShipColors(ships) {
      if (shipColors.size > 0 || ships.length === 0) {
        return;
      }
      [...ships]
        .sort((a, b) => a.id - b.id)
        .forEach((ship, index) => shipColors.set(ship.id, PLAYER_COLORS[index % PLAYER_COLORS.length]));
      showIdentity(shipColors.get(myShipId) ?? null);
    }

    function colorOf(shipId) {
      return shipColors.get(shipId) ?? PLAYER_COLORS[Math.abs(shipId) % PLAYER_COLORS.length];
    }

    // Tells the player which spaceship is its own, also in the tab title to tell the tabs apart.
    function showIdentity(color) {
      if (color) {
        identityEl.textContent = `You are the ${color.name} spaceship`;
        identityEl.style.color = color.hex;
        document.title = `ScalaParty - ${color.name}`;
      } else {
        identityEl.textContent = '';
        document.title = 'ScalaParty';
      }
    }

    function updateFromServer(rawMessage) {
      try {
        const payload = JSON.parse(rawMessage);
        if (handleServerMessage(payload)) {
          return;
        }
        const entities = extractEntities(payload);

        currentShips = entities
          .filter(entry => entry && 'Spaceship' in entry)
          .map(entry => toShipState(entry.Spaceship));
        assignShipColors(currentShips);

        currentBullets = entities
          .filter(entry => entry && 'Bullet' in entry)
          .map(entry => toPosition(entry.Bullet));
      } catch (error) {
        console.error('Invalid server payload', error);
      }
    }

    // Each spaceship has the color of its player, the same in every client.
    function drawSpaceship(x, y, angle, color) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);

      ctx.beginPath();
      ctx.moveTo(SHIP_HEIGHT / 2, 0);
      ctx.lineTo(-SHIP_HEIGHT / 2, -SHIP_BASE / 2);
      ctx.lineTo(-SHIP_HEIGHT / 2, SHIP_BASE / 2);
      ctx.closePath();

      ctx.fillStyle = color.hex;
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.restore();
    }

    function drawBullet(x, y) {
      ctx.beginPath();
      ctx.arc(x, y, BULLET_RADIUS, 0, Math.PI * 2);
      ctx.fillStyle = '#ffcc00';
      ctx.fill();
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      currentShips.forEach(ship => drawSpaceship(ship.position.x, ship.position.y, ship.angle, colorOf(ship.id)));
      currentBullets.forEach(bullet => drawBullet(bullet.x, bullet.y));
    }

    function gameLoop() {
      render();
      requestAnimationFrame(gameLoop);
    }

    socket.addEventListener('open', () => {
      statusEl.textContent = 'Connected to ScalaParty server';
      appendLog('WebSocket connected');
    });

    socket.addEventListener('close', (event) => {
      if (!turnedAway) {
        statusEl.textContent = 'Disconnected from server';
      }
      appendLog(`WebSocket disconnected (code ${event.code})`);
    });

    socket.addEventListener('error', () => {
      appendLog('WebSocket error');
    });

    socket.addEventListener('message', (event) => {
      appendLog(`Received: ${event.data}`);
      updateFromServer(event.data);
    });

    // Sends a PlayerInput command to the server, doing nothing if the socket is not ready yet.
    function sendCommand(command, label) {
      if (socket.readyState !== WebSocket.OPEN) {
        statusEl.textContent = 'Socket not ready yet';
        appendLog(`${label} skipped: socket not open`);
        return false;
      }
      const json = JSON.stringify(command);
      socket.send(json);
      appendLog(`Sent: ${json}`);
      return true;
    }

    document.addEventListener('keydown', (event) => {
      switch (event.key.toLowerCase()) {
        case 'r': {
          event.preventDefault();
          const angle = 2.0;
          if (sendCommand({ Rotate: { angle } }, 'Rotate')) {
            statusEl.textContent = `Rotated by ${angle}°`;
          }
          break;
        }
        case ' ': {
          event.preventDefault();
          if (sendCommand({ Shoot: {} }, 'Shoot')) {
            statusEl.textContent = 'Fired!';
          }
          break;
        }
      }
    });

    appendLog(`Connecting to WebSocket at ${protocol}://${host}:${port}/scalaparty/ws`);
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
