name: Release ScalaParty

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release Fat JAR
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ScalaParty

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'sbt'
          cache-dependency-path: './ScalaParty/build.sbt'

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Run Unit Tests
        run: sbt test

      - name: Build Executable Assembly JAR
        run: sbt assembly

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ScalaParty/target/scala-3.*/scalaparty-*.*.*.jar
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}