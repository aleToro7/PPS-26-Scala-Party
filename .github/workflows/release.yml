name: Release ScalaParty

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: write

jobs:
  release:
    name: Build & Release Executable JAR
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ScalaParty

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "sbt"
          cache-dependency-path: "./ScalaParty/build.sbt"

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Extract Version from sbt
        id: extract_version
        run: |
          VERSION=$(sbt --error "print ThisBuild/version")
          echo "RELEASE_VERSION=v$VERSION" >> $GITHUB_ENV
          echo "Target Release Version: v$VERSION"

      - name: Run Unit Tests
        run: sbt test

      - name: Build Executable Assembly JAR
        run: sbt infrastructure/assembly

      - name: Create Git Tag & GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          name: Release ${{ env.RELEASE_VERSION }}
          files: |
            ScalaParty/infrastructure/target/scala-3.*/scalaparty-*.jar
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
