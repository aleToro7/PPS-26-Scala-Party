name: Scala CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ScalaParty
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'sbt'
          cache-dependency-path: './ScalaParty/build.sbt'

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Compile project
        run: sbt compile

  test:
    name: Run Unit Tests
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ScalaParty
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'sbt'
          cache-dependency-path: './ScalaParty/build.sbt'

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Run tests
        run: sbt test

  lint:
    name: Code Linting
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ScalaParty
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'sbt'
          cache-dependency-path: './ScalaParty/build.sbt'

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Check code formatting
        run: sbt scalafmtCheckAll
